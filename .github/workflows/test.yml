name: tb_div_sub
on: [push]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Icarus Verilog
        run: sudo apt-get install -y iverilog
      - name: Run Testbench
        run: iverilog -g2001 -o sim div_sub.v tb_div_sub.v && vvp -n sim
