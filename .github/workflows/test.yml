name: assig_q1_tb.v
on: [push]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Icarus Verilog
        run: sudo apt-get install -y iverilog
      - name: Run Testbench
        run: iverilog -g2001 -o sim assign_q1.v assign_q1_tb.v && vvp -n sim
